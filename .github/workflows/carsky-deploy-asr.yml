name: carsky-deploy-asr

# Restart container `viva-asr` trên CarSky sau khi đã đổi image, và xác minh nó
# trở lại Running.
#
# ## 🔴 Workflow này KHÔNG tự đổi được image — đọc trước khi dùng
#
# Bản đầu của file này tự PATCH trường `image` của node. Gọi thật ngày 07/08 thì:
#
#   PATCH /api/v1/nodes/{nodeId}  ->  404
#
# Endpoint đó CÓ trong `openapi.json` (73 endpoint) nhưng server không có route —
# đúng lớp lỗi đã ghi ở `docs/backend-docs/carsky-api.md` §10 cho
# `POST /nodes/{nodeId}/pins`. Spec của CarSky khai nhiều hơn thứ nó chạy được,
# nên đừng tin spec khi chưa gọi thử.
#
# Ba đường thay thế đều tắc, đã kiểm bằng chính `openapi.json`:
#
#   PATCH /blueprints/{id}        chỉ nhận `name` + `description`
#   POST  /blueprints/{id}/batch  chỉ có addNode | addPin | addEdge — toàn thao tác THÊM
#   POST  /blueprints/import      400, enum pinType không nhận ETHERNET (§10)
#
# ⚠️ Và ĐỪNG `DELETE /nodes/{nodeId}` rồi tạo lại: node này cần một pin ETHERNET
# nối vào `IVI Switch`, mà pin ETHERNET **chỉ tạo được trong web UI** (§10). Xoá
# node là đường một chiều làm hỏng room demo.
#
# ## Cách dùng đúng
#
# 1. Đổi trường image của node trong **web UI CarSky** sang digest mới.
# 2. Chạy workflow này với đúng digest đó. Nó đối chiếu image thật trên node,
#    từ chối chạy nếu chưa khớp, rồi restart và chờ node Running trở lại.
#
# Bước 1 không tự động hoá được cho tới khi CarSky bật route PATCH.
#
# ## Vì sao KHÔNG phải `on: push`
#
# Room này là môi trường demo dùng chung, và quota nền tảng là
# MAX_CONCURRENT_DEPLOYMENTS = 2. Một workflow chạy theo mỗi lần merge sẽ khởi
# động lại container giữa lúc đang tổng duyệt. Chạy tay trước; khi đã trơn vài
# lần thì đổi trigger là một dòng.
#
# ## Vì sao vẫn phải là digest, không phải tag
#
# Node `VIVA ASR` ghim image bằng **digest**:
#
#   registry.hackathon-2.carsky.io/viva/viva-asr@sha256:63c2c56a...
#
# Push đè lên một tag rồi restart sẽ kéo lại đúng image cũ — pipeline chạy mà
# không đổi gì. Đổi image trong UI cũng phải dán digest, đừng dán tag.
#
# ## Cái workflow này KHÔNG làm được
#
# Cài APK lên node Android. Cần `adb`, mà họ endpoint điều khiển VM chưa dùng
# được (xem docs/backend-docs/carsky-api.md §4). Đây là CD cho **service ASR**,
# không phải CD cho app — đừng gọi nhầm tên trong báo cáo.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image đầy đủ, NÊN dùng dạng digest (registry.hackathon-2.carsky.io/viva/viva-asr@sha256:...)"
        required: true
        type: string
      room_id:
        description: "Room đang chạy"
        required: true
        default: "v37aa3knc6t1embelr5yi"
        type: string
      node_id:
        description: "Node VIVA ASR trong blueprint"
        required: true
        default: "b8eada00-d137-4fdc-a131-2197b1d1356b"
        type: string
      dry_run:
        description: "Chỉ in ra thay đổi sẽ làm, không gọi PATCH/restart"
        required: true
        default: true
        type: boolean

# Hai lần chạy chồng nhau lên cùng một room sẽ đua nhau PATCH rồi restart, và
# bản lùi của lần này có thể ghi đè bản mới của lần kia.
concurrency:
  group: carsky-deploy-asr-${{ inputs.room_id }}
  cancel-in-progress: false

env:
  BASE: https://hackathon-2.carsky.io/api/v1
  REGISTRY: registry.hackathon-2.carsky.io

jobs:
  deploy:
    name: PATCH digest + restart node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kiểm secret
        run: |
          if [ -z "${{ secrets.CARSKY_API_KEY }}" ]; then
            echo "::error::Thiếu secret CARSKY_API_KEY. Thêm ở Settings → Secrets → Actions."
            exit 1
          fi

      - name: chặn image lạ
        run: |
          # Workflow này PATCH thẳng vào blueprint của room demo. Một image trỏ
          # sai registry là đường ngắn nhất để node kẹt ở ImagePullBackOff giữa
          # buổi duyệt, nên từ chối sớm thay vì để nền tảng phát hiện.
          case "${{ inputs.image }}" in
            ${{ env.REGISTRY }}/*) ;;
            *) echo "::error::image phải bắt đầu bằng ${{ env.REGISTRY }}/"; exit 1 ;;
          esac
          case "${{ inputs.image }}" in
            *@sha256:*) ;;
            *) echo "::warning::Đang dùng tag chứ không phải digest. Tag là con trỏ động — bản deploy sẽ không lặp lại được." ;;
          esac

      - name: đọc trạng thái hiện tại
        id: current
        run: |
          set -euo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'

          # Blueprint id lấy từ deployment chứ không hardcode: room từng được
          # dựng lại bằng một blueprint clone khác, và một id chép cứng sẽ PATCH
          # nhầm vào bản không chạy — im lặng, không lỗi.
          #
          # Lưu ý tham số tên là `device` nhưng nhận đúng room id. Đừng dùng
          # CARSKY_DEVICE_ID trong backend/.env: giá trị ở đó là VIVA 2, không
          # phải room demo, và find sẽ trả về [].
          FIND=$(curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/find?device=$ROOM")
          BP=$(echo "$FIND" | jq -r '.[0].blueprintId // empty')
          if [ -z "$BP" ]; then
            echo "::error::Không tìm thấy deployment nào cho room $ROOM"
            exit 1
          fi

          NODE=$(curl -fsS -H "x-api-key: $KEY" "$BASE/blueprints/$BP" \
                 | jq -c --arg id '${{ inputs.node_id }}' '.nodes[] | select(.id == $id)')
          if [ -z "$NODE" ]; then
            echo "::error::Blueprint $BP không có node ${{ inputs.node_id }}"
            exit 1
          fi

          OLD_IMAGE=$(echo "$NODE" | jq -r '.config.image // empty')
          # Config đầy đủ, để bước PATCH trộn chứ không ghi đè — xem đầu file.
          echo "$NODE" | jq -c '.config' > /tmp/config-old.json

          echo "blueprint=$BP"        >> "$GITHUB_OUTPUT"
          echo "old_image=$OLD_IMAGE" >> "$GITHUB_OUTPUT"

          {
            echo "### Trạng thái trước khi đổi"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| room | \`$ROOM\` |"
            echo "| blueprint | \`$BP\` |"
            echo "| node | \`${{ inputs.node_id }}\` ($(echo "$NODE" | jq -r .label)) |"
            echo "| image trên node | \`$OLD_IMAGE\` |"
            echo "| image mong đợi | \`${{ inputs.image }}\` |"
            echo ""
            echo "Config hiện tại của node:"
            echo ""
            echo '```json'
            jq . /tmp/config-old.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: dừng ở đây nếu dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true — không restart."
          echo "Chạy lại với dry_run=false để áp dụng." >> "$GITHUB_STEP_SUMMARY"

      - name: đối chiếu image trên node
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Không PATCH được (route 404 — xem đầu file), nên thứ duy nhất làm
          # được là TỪ CHỐI chạy khi node chưa mang image mong đợi. Bỏ bước này
          # thì workflow sẽ restart node với image CŨ rồi báo xanh — một bản
          # deploy không đổi gì mà trông như đã thành công.
          OLD='${{ steps.current.outputs.old_image }}'
          WANT='${{ inputs.image }}'
          if [ "$OLD" != "$WANT" ]; then
            {
              echo "::error::Node đang mang image khác với ô \`image\` bạn nhập."
              echo "  trên node : $OLD"
              echo "  bạn nhập  : $WANT"
              echo "  Đổi image trong web UI CarSky trước, rồi chạy lại workflow này."
            } >&2
            exit 1
          fi
          echo "Image trên node khớp với digest mong đợi."

      - name: restart node
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Chỉ node này, KHÔNG phải `POST /deployments/{room}/restart` (cả room).
          # Bán kính ảnh hưởng là một container thay vì 22 node.
          curl -fsS -X POST "$BASE/deployments/${{ inputs.room_id }}/restart/${{ inputs.node_id }}" \
            -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
            -H "Content-Length: 0"
          echo "Đã gửi lệnh restart."

      - name: chờ node Running trở lại
        id: verify
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          # Kéo image mới rồi khởi động lại mất vài chục giây; 5 phút là rộng
          # rãi mà vẫn không treo job cả tiếng nếu image hỏng.
          DEADLINE=$(( $(date +%s) + 300 ))
          PHASE=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            PHASE=$(curl -fsS -H "x-api-key: $KEY" \
                    "$BASE/deployments/${{ inputs.room_id }}/nodes" \
                    | jq -r --arg id '${{ inputs.node_id }}' \
                        '.[] | select(.name == $id) | .phase')
            echo "phase=$PHASE"
            [ "$PHASE" = "Running" ] && break
            sleep 10
          done
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          if [ "$PHASE" != "Running" ]; then
            echo "::error::Node không trở lại Running (phase cuối: $PHASE)"
            exit 1
          fi
          echo "Node đã Running với image mới." >> "$GITHUB_STEP_SUMMARY"

      - name: hướng dẫn lùi lại nếu node không lên
        # Không còn bước lùi tự động: bản cũ lùi bằng `PATCH /nodes/{id}`, mà
        # route đó 404 nên nó chỉ fail thêm một lần nữa và làm log khó đọc.
        # Đổi image ngược lại cũng phải làm trong UI, nên thứ hữu ích nhất
        # workflow làm được ở đây là nói rõ phải bấm gì.
        if: ${{ failure() && !inputs.dry_run && steps.current.outputs.old_image != '' }}
        run: |
          {
            echo ""
            echo "### ⚠️ Node không trở lại Running"
            echo ""
            echo "Không có bước lùi tự động — \`PATCH /nodes/{id}\` trả 404 (xem đầu file)."
            echo "Lùi bằng tay trong web UI CarSky: đổi image của node về"
            echo ""
            echo '```'
            echo "${{ steps.current.outputs.old_image }}"
            echo '```'
            echo ""
            echo "rồi chạy lại workflow này với đúng digest đó để restart và xác minh."
          } >> "$GITHUB_STEP_SUMMARY"
