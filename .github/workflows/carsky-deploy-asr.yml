name: carsky-deploy-asr

# Đổi image container `viva-asr` trên CarSky: PATCH blueprint, xoá deployment,
# dựng lại, chờ room lên đủ node. Tự lùi nếu ASR không lên được.
#
# ## ⚠️ `openapi.json` ghi SAI đường dẫn PATCH — đừng lấy path từ đó
#
# Bản đầu của file này PATCH vào `/api/v1/nodes/{nodeId}`, lấy từ `openapi.json`.
# Gọi thật 07/08 trả **404 Route not found**, và điều đó từng bị kết luận nhầm
# thành "CarSky không cho đổi image bằng API".
#
# Sai. `Car-Sky-Platform.html` (tài liệu vận hành chính thức, mục "API & MCP
# Tools") ghi đường dẫn thật có thêm tiền tố `/blueprints`:
#
#   PATCH /api/v1/nodes/{nodeId}              -> 404   (openapi.json — SAI)
#   PATCH /api/v1/blueprints/nodes/{nodeId}   -> 200   (tài liệu — ĐÚNG)
#
# Đã dò bằng body rỗng `{}` nên không ghi gì, và kiểm lại sau đó: config nguyên
# vẹn. Bài học: `openapi.json` của CarSky khai sai cả địa chỉ, không chỉ khai
# thừa endpoint. Đối chiếu với tài liệu người viết trước khi tin.
#
# Cùng lớp lỗi này, `carsky-api.md` §10 kết luận "pin ETHERNET chỉ tạo được
# trong web UI" dựa trên `POST /nodes/{nodeId}/pins` -> 404. Đã kiểm lại trên
# một blueprint clone tạm: đường đúng là `/blueprints/nodes/{id}/pins` và nó
# TỒN TẠI, nhưng trả 422 `Pin type ... is not allowed on container nodes.
# Allowed: CAN, KUKSA, VIDEO`. Kết luận của §10 vẫn đúng, chỉ cơ chế khác —
# là giới hạn thiết kế, không phải route thiếu. Xem §9d.
#
# ## `restart/{node}` trả 500 nhưng VẪN CHẠY — đừng tin mã HTTP
#
# Đo 08/08: `POST /deployments/{room}/restart/{node}` trả **500, body rỗng**, mà
# node vẫn chuyển `Provisioning` ngay sau đó rồi `Running` sau ~50 giây. Lệnh có
# tác dụng; chỉ mã trả về là sai.
#
# Bản trước dùng `curl -f` nên coi 500 là thất bại → step fail → rollback chạy →
# PATCH đè image cũ lên bản mới **vừa ghi thành công**. Deploy tự huỷ chính nó.
#
# Nên mọi phán xét ở đây dựa vào **hệ quả quan sát được** (phase của node đổi),
# không dựa vào lời khai của server. Bước verify vì thế có hai giai đoạn: chờ
# node RỜI `Running` (chứng minh restart thật sự xảy ra), rồi mới chờ nó quay
# lại. Thiếu giai đoạn một thì một lệnh restart không ăn gì sẽ trông y hệt một
# lần deploy thành công.
#
# ## Đổi image = XOÁ deployment rồi DỰNG LẠI. Không có cách nhẹ hơn.
#
# Hai cách hiển nhiên hơn đều KHÔNG áp được image mới, đã đo 08/08:
#
#   restart/{node}   chỉ chạy lại pod theo spec K8s hiện có, không đọc lại
#                    blueprint -> pod lên lại vẫn mang image CŨ
#   Redeploy (UI)    "Partial redeploy: 1 node(s) failed", không lộ lý do,
#                    thử 3 lần đều vậy
#
# Đối chứng chứng minh không phải lỗi image: cùng blueprint, cùng image 0.2.1,
# dựng deployment MỚI trên device thứ hai thì ASR `Running` sau **9 giây**.
# Chi tiết ở docs/backend-docs/carsky-api.md §9h.
#
# Cái giá phải trả: xoá deployment huỷ pod đang chạy, mất ~3 phút mới đủ 22/22
# (node `IVI - Android` boot chậm nhất). **Đừng chạy job này sát giờ duyệt.**
# Muốn không gián đoạn thì dựng trước một deployment thứ hai trên device khác
# rồi mới xoá cái cũ — quota cho phép 2 deployment đồng thời.
#
# ⚠️ Blueprint có cờ `Locked` để chống sửa nhầm lúc đang demo. Bật khoá thì bước
# PATCH sẽ fail — đó là có chủ đích, đừng gỡ khoá giữa buổi duyệt.
#
# ## Vì sao KHÔNG phải `on: push`
#
# Room này là môi trường demo dùng chung, và quota nền tảng là
# MAX_CONCURRENT_DEPLOYMENTS = 2. Một workflow chạy theo mỗi lần merge sẽ khởi
# động lại container giữa lúc đang tổng duyệt. Chạy tay trước; khi đã trơn vài
# lần thì đổi trigger là một dòng.
#
# ## Vì sao vẫn phải là digest, không phải tag
#
# Node `VIVA ASR` ghim image bằng **digest**:
#
#   registry.hackathon-2.carsky.io/viva/viva-asr@sha256:63c2c56a...
#
# Push đè lên một tag rồi restart sẽ kéo lại đúng image cũ — pipeline chạy mà
# không đổi gì. Đổi image trong UI cũng phải dán digest, đừng dán tag.
#
# ## Cái workflow này KHÔNG làm được
#
# Cài APK lên node Android. Cần `adb`, mà họ endpoint điều khiển VM chưa dùng
# được (xem docs/backend-docs/carsky-api.md §4). Đây là CD cho **service ASR**,
# không phải CD cho app — đừng gọi nhầm tên trong báo cáo.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image đầy đủ, NÊN dùng dạng digest (registry.hackathon-2.carsky.io/viva/viva-asr@sha256:...)"
        required: true
        type: string
      room_id:
        description: "Room đang chạy"
        required: true
        default: "v37aa3knc6t1embelr5yi"
        type: string
      node_id:
        description: "Node VIVA ASR trong blueprint"
        required: true
        default: "b8eada00-d137-4fdc-a131-2197b1d1356b"
        type: string
      dry_run:
        description: "Chi in ra thay doi se lam, khong PATCH va khong xoa-dung-lai"
        required: true
        default: true
        type: boolean

# Hai lần chạy chồng nhau lên cùng một room sẽ đua nhau PATCH rồi restart, và
# bản lùi của lần này có thể ghi đè bản mới của lần kia.
concurrency:
  group: carsky-deploy-asr-${{ inputs.room_id }}
  cancel-in-progress: false

env:
  BASE: https://hackathon-2.carsky.io/api/v1
  REGISTRY: registry.hackathon-2.carsky.io

jobs:
  deploy:
    name: PATCH digest + dung lai deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kiểm secret
        run: |
          if [ -z "${{ secrets.CARSKY_API_KEY }}" ]; then
            echo "::error::Thiếu secret CARSKY_API_KEY. Thêm ở Settings → Secrets → Actions."
            exit 1
          fi

      - name: chặn image lạ
        run: |
          # Workflow này PATCH thẳng vào blueprint của room demo. Một image trỏ
          # sai registry là đường ngắn nhất để node kẹt ở ImagePullBackOff giữa
          # buổi duyệt, nên từ chối sớm thay vì để nền tảng phát hiện.
          case "${{ inputs.image }}" in
            ${{ env.REGISTRY }}/*) ;;
            *) echo "::error::image phải bắt đầu bằng ${{ env.REGISTRY }}/"; exit 1 ;;
          esac
          case "${{ inputs.image }}" in
            *@sha256:*) ;;
            *) echo "::warning::Đang dùng tag chứ không phải digest. Tag là con trỏ động — bản deploy sẽ không lặp lại được." ;;
          esac

      - name: đọc trạng thái hiện tại
        id: current
        run: |
          set -euo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'

          # Blueprint id lấy từ deployment chứ không hardcode: room từng được
          # dựng lại bằng một blueprint clone khác, và một id chép cứng sẽ PATCH
          # nhầm vào bản không chạy — im lặng, không lỗi.
          #
          # Lưu ý tham số tên là `device` nhưng nhận đúng room id. Đừng dùng
          # CARSKY_DEVICE_ID trong backend/.env: giá trị ở đó là VIVA 2, không
          # phải room demo, và find sẽ trả về [].
          FIND=$(curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/find?device=$ROOM")
          BP=$(echo "$FIND" | jq -r '.[0].blueprintId // empty')
          if [ -z "$BP" ]; then
            echo "::error::Không tìm thấy deployment nào cho room $ROOM"
            exit 1
          fi

          NODE=$(curl -fsS -H "x-api-key: $KEY" "$BASE/blueprints/$BP" \
                 | jq -c --arg id '${{ inputs.node_id }}' '.nodes[] | select(.id == $id)')
          if [ -z "$NODE" ]; then
            echo "::error::Blueprint $BP không có node ${{ inputs.node_id }}"
            exit 1
          fi

          OLD_IMAGE=$(echo "$NODE" | jq -r '.config.image // empty')
          # Config đầy đủ, để bước PATCH trộn chứ không ghi đè — xem đầu file.
          echo "$NODE" | jq -c '.config' > /tmp/config-old.json

          echo "blueprint=$BP"        >> "$GITHUB_OUTPUT"
          echo "old_image=$OLD_IMAGE" >> "$GITHUB_OUTPUT"

          {
            echo "### Trạng thái trước khi đổi"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| room | \`$ROOM\` |"
            echo "| blueprint | \`$BP\` |"
            echo "| node | \`${{ inputs.node_id }}\` ($(echo "$NODE" | jq -r .label)) |"
            echo "| image trên node | \`$OLD_IMAGE\` |"
            echo "| image mong đợi | \`${{ inputs.image }}\` |"
            echo ""
            echo "Config hiện tại của node:"
            echo ""
            echo '```json'
            jq . /tmp/config-old.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: dừng ở đây nếu dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true — không restart."
          echo "Chạy lại với dry_run=false để áp dụng." >> "$GITHUB_STEP_SUMMARY"

      - name: PATCH image của node
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Trộn: giữ nguyên env và mọi khoá khác, chỉ thay `image`. Gửi mỗi
          # `image` có thể ghi đè cả object và xoá sạch ASR_DEVICE /
          # ASR_MODEL_NAME / ASR_COMPUTE_TYPE — ASR sẽ khởi động với model mặc
          # định mà không báo lỗi.
          jq -c --arg img '${{ inputs.image }}' '.image = $img' /tmp/config-old.json > /tmp/config-new.json
          jq -n --slurpfile c /tmp/config-new.json '{config: $c[0]}' > /tmp/patch.json

          curl -fsS -X PATCH "$BASE/blueprints/nodes/${{ inputs.node_id }}" \
            -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @/tmp/patch.json > /tmp/patch-response.json
          echo "PATCH xong."

          # Đọc lại từ server thay vì tin mã 200: PATCH có thể nhận body rồi
          # lưu khác đi. Ba biến env là thứ mất đi âm thầm nhất nên đếm luôn.
          NEW=$(curl -fsS -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
                "$BASE/blueprints/${{ steps.current.outputs.blueprint }}" \
                | jq -c --arg id '${{ inputs.node_id }}' '.nodes[] | select(.id == $id) | .config')
          GOT_IMG=$(echo "$NEW" | jq -r '.image // empty')
          GOT_ENV=$(echo "$NEW" | jq -r '.env | length')
          WANT_ENV=$(jq -r '.env | length' /tmp/config-old.json)
          if [ "$GOT_IMG" != "${{ inputs.image }}" ]; then
            echo "::error::PATCH tra 200 nhung image tren server van la: $GOT_IMG"; exit 1
          fi
          if [ "$GOT_ENV" != "$WANT_ENV" ]; then
            echo "::error::So bien env doi tu $WANT_ENV thanh $GOT_ENV — config bi ghi de"; exit 1
          fi
          echo "Da xac minh: image doi dung, env con $GOT_ENV bien."

      - name: xoá deployment rồi dựng lại
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'
          BP='${{ steps.current.outputs.blueprint }}'

          # ⚠️ ĐÂY LÀ ĐƯỜNG DUY NHẤT ÁP ĐƯỢC IMAGE MỚI. Hai cách hiển nhiên hơn
          # đều KHÔNG hoạt động, đã đo 08/08:
          #
          #   restart/{node}  chỉ chạy lại pod theo spec K8s hiện có, không đọc
          #                   lại blueprint -> pod lên lại vẫn mang image CŨ
          #   Redeploy (UI)   "Partial redeploy: 1 node(s) failed", không lộ lý do
          #
          # Chứng minh bằng đối chứng: cùng blueprint, cùng image 0.2.1, dựng
          # deployment MỚI trên device thứ hai thì ASR Running sau 9 giây.
          # Xem docs/backend-docs/carsky-api.md §9h.
          #
          # Cái giá: xoá pod đang chạy, mất ~3 phút mới có lại. Không có cách nào
          # rẻ hơn cho tới khi CarSky sửa Redeploy.
          echo "::warning::Xoá deployment $ROOM — ASR sẽ gián đoạn ~3 phút."
          curl -fsS -X DELETE "$BASE/deployments/$ROOM" -H "x-api-key: $KEY" >/dev/null
          echo "Đã xoá. Dựng lại từ blueprint $BP..."

          # Tên phải khác deployment vừa xoá — trùng tên có thể bị từ chối.
          NAME="viva-asr-$(date -u +%Y%m%d-%H%M%S)"
          curl -fsS -X POST "$BASE/deployments" \
            -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"blueprintId\":\"$BP\",\"roomId\":\"$ROOM\",\"name\":\"$NAME\"}" \
            > /tmp/redeploy.json
          echo "deployment moi: $(jq -r '.id + \" | \" + .namespace' /tmp/redeploy.json)"

      - name: chờ room lên lại đủ node
        id: verify
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          nodes_json() {
            curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/${{ inputs.room_id }}/nodes" 2>/dev/null || echo '[]'
          }

          # Đo 08/08 trên lần dựng lại thật: 21/22 sau ~60s, node `IVI - Android`
          # (skycraft, phải boot cả máy ảo Android) lên nốt ở ~180s. Cho 420s để
          # còn dư khi cluster bận.
          DEADLINE=$(( $(date +%s) + 420 ))
          TOTAL=0; READY=0; ASR=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            J=$(nodes_json)
            TOTAL=$(echo "$J" | jq 'length')
            READY=$(echo "$J" | jq '[.[] | select(.phase == "Running")] | length')
            ASR=$(echo "$J" | jq -r --arg id '${{ inputs.node_id }}' '.[] | select(.name == $id) | .phase')
            echo "$READY/$TOTAL Running | ASR=${ASR:-chua co}"
            [ "$TOTAL" -gt 0 ] && [ "$READY" = "$TOTAL" ] && break
            sleep 15
          done

          echo "ready=$READY/$TOTAL" >> "$GITHUB_OUTPUT"

          # ASR là node DUY NHẤT job này chịu trách nhiệm. Node khác chưa lên
          # (thường là IVI - Android boot chậm) thì cảnh báo chứ không fail —
          # lùi lại vì lý do đó sẽ xoá-dựng-lại thêm một lần vô ích.
          if [ "$ASR" != "Running" ]; then
            echo "::error::Node ASR khong len duoc (phase: ${ASR:-khong thay})"
            exit 1
          fi
          if [ "$READY" != "$TOTAL" ]; then
            echo "::warning::ASR da Running nhung room moi $READY/$TOTAL — kiem lai bang mat."
          fi
          {
            echo ""
            echo "### ✅ Room đã lên lại với image mới"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| node sẵn sàng | \`${{ steps.verify.outputs.ready }}\` |"
            echo "| image | \`${{ inputs.image }}\` |"
            echo ""
            echo "Xác minh bằng log (tham số \`?container=user\` không có trong openapi.json"
            echo "nhưng server nhận — xem carsky-api.md §5b):"
            echo ""
            echo '```'
            echo "GET $BASE/deployments/${{ inputs.room_id }}/logs/${{ inputs.node_id }}?container=user&tail=10"
            echo '```'
            echo ""
            echo "Dòng \`VIVA_ASR model ready …\` phải có mốc thời gian của lần dựng này."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: lùi lại image cũ nếu ASR không lên
        # Lùi bằng ĐÚNG cơ chế đã dùng để tiến: PATCH + xoá + dựng lại. Bản trước
        # lùi bằng `restart/{node}`, mà restart không đọc lại blueprint nên nó
        # chưa bao giờ thật sự lùi được gì.
        #
        # ⚠️ Điều kiện bám vào `steps.verify.outcome`, KHÔNG phải `failure()`
        # chung chung: lần chạy 08/08 dùng `failure()` thì một bước fail chỉ vì
        # API trả 500 (dù lệnh đã chạy) cũng kích rollback, và rollback đè image
        # cũ lên bản mới vừa ghi thành công. Deploy tự huỷ chính nó.
        if: ${{ always() && !inputs.dry_run && steps.verify.outcome == 'failure' && steps.current.outputs.old_image != '' }}
        run: |
          set -euo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'
          BP='${{ steps.current.outputs.blueprint }}'
          echo "::warning::Lùi về ${{ steps.current.outputs.old_image }}"

          jq -n --slurpfile c /tmp/config-old.json '{config: $c[0]}' > /tmp/rollback.json
          curl -fsS -X PATCH "$BASE/blueprints/nodes/${{ inputs.node_id }}" \
            -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            --data @/tmp/rollback.json >/dev/null

          # Room có thể đã bị xoá ở bước trước rồi. `|| true` để không chết vì
          # xoá một thứ không còn tồn tại.
          curl -fsS -X DELETE "$BASE/deployments/$ROOM" -H "x-api-key: $KEY" >/dev/null || true
          curl -fsS -X POST "$BASE/deployments" \
            -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"blueprintId\":\"$BP\",\"roomId\":\"$ROOM\",\"name\":\"viva-rollback-$(date -u +%Y%m%d-%H%M%S)\"}" \
            >/dev/null
          {
            echo ""
            echo "### ⚠️ Đã lùi lại"
            echo ""
            echo "Blueprint trả về \`${{ steps.current.outputs.old_image }}\` và room đang dựng lại."
            echo "Mất ~3 phút mới đủ 22/22 — **kiểm bằng mắt trước khi coi là xong**."
          } >> "$GITHUB_STEP_SUMMARY"
